<!DOCTYPE html>
<html lang="zh-Hant" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'none'; form-action 'self' https://forms.gle; upgrade-insecure-requests;">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>史學研究的數位工具 | 明日歷史工作室</title>
    <script src="../assets/vendor/tailwindcss-cdn.js"></script>
    <script src="../assets/vendor/lucide-0.468.0.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { accent: '#8333e9' }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap');
        body { font-family: 'Inter', "PingFang TC", "Microsoft JhengHei", sans-serif; }
        .hero-title { line-height: 1.05; letter-spacing: -0.02em; }
        ::selection { background-color: #8333e9; color: #fff; }
        ::-webkit-scrollbar { width: 0px; }
        html { scroll-behavior: smooth; }

        /* 噪音紋理疊層 */
        .bg-grain::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.02;
            pointer-events: none;
            z-index: 9999;
        }

        /* Animation Classes */
        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body class="bg-white dark:bg-black text-black dark:text-white transition-colors duration-500 bg-grain">
    <nav id="navbar" class="fixed w-full z-50 transition-all duration-300 bg-white/80 dark:bg-black/80 backdrop-blur-md border-b border-black/5 dark:border-white/10">
        <div class="max-w-6xl mx-auto px-6">
            <div class="flex justify-between h-20 items-center">
                <div class="flex items-center space-x-3 cursor-pointer" onclick="window.location.href='../index.html'">
                    <div class="w-8 h-8 flex items-center justify-center border border-current rounded-sm">
                        <i data-lucide="landmark" class="w-5 h-5"></i>
                    </div>
                    <div class="flex flex-col text-left">
                        <span class="font-bold text-lg tracking-widest leading-none">明日歷史</span>
                        <span class="text-[9px] tracking-tighter uppercase opacity-50">Tomorrow History</span>
                    </div>
                </div>
                <div class="hidden md:flex items-center space-x-8">
                    <a href="../index.html" class="text-sm tracking-widest opacity-40 hover:opacity-100 font-bold no-underline">返回首頁</a>
                    <button onclick="toggleDarkMode()" class="opacity-40 hover:opacity-100 transition-opacity">
                        <i id="theme-icon" data-lucide="moon" size="18"></i>
                    </button>
                    <a href="https://forms.gle/esJKC67wEYaBsKYY6" target="_blank" rel="noopener noreferrer" class="contact-btn px-5 py-2 text-sm font-bold border border-current hover:bg-accent hover:text-white hover:border-accent transition-all uppercase tracking-widest no-underline rounded-sm">聯繫我們</a>
                </div>
            </div>
        </div>
    </nav>

    <main>
        <section class="pt-48 pb-32 px-6 bg-stone-50 dark:bg-zinc-950 transition-colors duration-500">
            <div class="max-w-6xl mx-auto">
                <div class="flex items-center space-x-2 mb-8 text-accent opacity-80">
                    <i data-lucide="book-open" size="16"></i>
                    <span class="text-xs font-bold tracking-[0.2em] uppercase">114學年度下學期 歷史學系選修</span>
                </div>
                <h1 class="hero-title text-6xl md:text-8xl lg:text-9xl font-black mb-10 tracking-tight">史學研究的<br /><span class="opacity-40">數位工具</span></h1>
                <p class="text-xl md:text-2xl max-w-3xl opacity-70 leading-relaxed font-light mb-16">
                    這不僅是一門工具課。我們將從「人文科學知識本體論」出發，結合卡片盒筆記法與現代數位工具，試圖重塑你在數位時代的研究思維。
                </p>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-8">
                    <div class="p-8 bg-white dark:bg-stone-900 border border-current/5 rounded-2xl">
                        <span class="text-xl font-black tracking-widest uppercase text-accent mb-4 block border-b border-accent/10 pb-2">授課教師</span>
                        <p class="text-3xl font-black mt-4">張哲維 教授</p>
                    </div>
                    <div class="p-8 bg-white dark:bg-stone-900 border border-current/5 rounded-2xl">
                        <span class="text-xl font-black tracking-widest uppercase text-accent mb-4 block border-b border-accent/10 pb-2">學分數</span>
                        <p class="text-3xl font-black mt-4">3 學分</p>
                    </div>
                    <div class="p-8 bg-white dark:bg-stone-900 border border-current/5 rounded-2xl">
                        <span class="text-xl font-black tracking-widest uppercase text-accent mb-4 block border-b border-accent/10 pb-2">預估人數</span>
                        <p class="text-3xl font-black mt-4">60 人</p>
                    </div>
                    <div class="p-8 bg-white dark:bg-stone-900 border border-current/5 rounded-2xl">
                        <span class="text-xl font-black tracking-widest uppercase text-accent mb-4 block border-b border-accent/10 pb-2">實作核心</span>
                        <p class="text-3xl font-black mt-4">Obsidian / AI</p>
                    </div>
                </div>
            </div>
        </section>

        <section class="py-32 px-6 bg-white dark:bg-black transition-colors duration-500">
            <div class="max-w-6xl mx-auto">
                <div class="mb-20">
                    <h2 class="text-sm font-bold tracking-[0.3em] uppercase opacity-30 mb-4">Course Syllabus</h2>
                    <h2 class="text-4xl font-black">課程進度表</h2>
                </div>
                <div id="syllabus-list" class="divide-y divide-current/10 border-t border-current/10"></div>
            </div>
        </section>
    </main>

    <footer class="py-24 px-6 bg-stone-50 dark:bg-zinc-950 border-t border-black/5 dark:border-white/10 transition-colors duration-500">
        <div class="max-w-6xl mx-auto text-center opacity-20 text-[10px] tracking-widest uppercase">
            <p>© 2026 Tomorrow History Studio | NCKU History</p>
        </div>
    </footer>

    <script>
        let darkMode = localStorage.getItem('theme') === 'dark';
        const syllabus = [
            { week: "01", title: "課程介紹", desc: "史學研究的工作流程；數位時代下人文科學的知識本體論" },
            { week: "02", title: "數位筆記軟體(一)", desc: "Obsidian的基本操作" },
            { week: "03", title: "數位筆記軟體(二)", desc: "Obsidian的元資料處理與基礎外掛" },
            { week: "04", title: "數位筆記軟體(三)", desc: "Obsidian與人文科學研究流程" },
            { week: "05", title: "數位筆記軟體(四)", desc: "Obsidian的進階外掛" },
            { week: "06", title: "資料科學基礎知識", desc: "人文資料科學的基礎知識" },
            { week: "07", title: "校際活動日", desc: "停課" },
            { week: "08", title: "維基百科實作(一)", desc: "歷史知識的共享與協作" },
            { week: "09", title: "維基百科實作(二)", desc: "條目創建與編輯實務" },
            { week: "10", title: "維基百科實作(三)", desc: "數位史料的公共呈現" },
            { week: "11", title: "數位工具：QGIS", desc: "地理資訊系統工具應用" },
            { week: "12", title: "數位工具：Gephi", desc: "社會網絡分析工具應用" },
            { week: "13", title: "人際網絡分析", desc: "數位人文的發展與研究趨勢" },
            { week: "14", title: "歷史遊戲劇本", desc: "歷史科普與遊戲化敘事創作" },
            { week: "15", title: "數位思維實踐", desc: "卡片盒筆記法的深度實踐" },
            { week: "16", title: "ChatGPT 運用(一)", desc: "生成式 AI 在史學研究的輔助" },
            { week: "17", title: "ChatGPT 運用(二)", desc: "克服語言障礙與跨語境解讀" },
            { week: "18", title: "期末成果發表", desc: "實作成果展示與同儕共評" }
        ];

        function init() {
            const container = document.getElementById('syllabus-list');
            container.innerHTML = syllabus.map(s => `
                <div class="py-12 px-6 flex flex-col md:flex-row md:items-center justify-between group hover:bg-accent/[0.02] border-b border-current/10 transition-all reveal relative overflow-hidden">
                    <div class="absolute inset-0 bg-accent/5 translate-y-full group-hover:translate-y-0 transition-transform duration-500"></div>
                    <div class="flex items-center space-x-8 relative z-10">
                        <span class="text-3xl font-black text-accent opacity-20 group-hover:opacity-100 transition-opacity duration-500">${s.week}</span>
                        <div class="text-left">
                            <h4 class="text-2xl font-black mb-2 group-hover:text-accent transition-colors duration-500">${s.title}</h4>
                            <p class="opacity-50 text-base font-medium group-hover:opacity-80 transition-opacity duration-500">${s.desc}</p>
                        </div>
                    </div>
                </div>
            `).join('');
            applyTheme();
            lucide.createIcons();
            setupScrollReveal();
        }

        function setupScrollReveal() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) entry.target.classList.add('active');
                });
            }, { threshold: 0.1 });
            document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
        }

        function toggleDarkMode() { darkMode = !darkMode; localStorage.setItem('theme', darkMode ? 'dark' : 'light'); applyTheme(); }

        function applyTheme() {
            const html = document.documentElement;
            const themeIcon = document.getElementById('theme-icon');
            if (darkMode) { html.classList.add('dark'); themeIcon.setAttribute('data-lucide', 'sun'); } 
            else { html.classList.remove('dark'); themeIcon.setAttribute('data-lucide', 'moon'); }
            lucide.createIcons();
        }
        init();
    </script>
</body>
</html>
