<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; font-src 'self' https://cdnjs.cloudflare.com; img-src 'self' data:; connect-src 'none'; form-action 'self'; upgrade-insecure-requests;">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>成員介紹 | 明日歷史工作室</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body class="light-mode">
    <header>
        <nav>
            <a href="index.html" class="logo" style="color: white; text-decoration: none;">明日歷史工作室</a>
            <ul>
                <li><a href="index.html" class="nav-btn">返回首頁</a></li>
                <li><button id="theme-toggle" class="theme-btn"><i class="fas fa-moon"></i></button></li>
            </ul>
        </nav>
    </header>

    <section class="container">
        <h2>成員介紹</h2>
        <div class="team-grid">
            <div class="team-card">
                <i class="fas fa-user-tie"></i>
                <h3>張哲維</h3>
                <p>國立成功大學歷史學系助理教授 / 指導老師</p>
            </div>
            <div class="team-card">
                <i class="fas fa-user-cog"></i>
                <h3>蕭永宜</h3>
                <p>管理人</p>
            </div>
            <div class="team-card">
                <i class="fas fa-user-edit"></i>
                <h3>侯欽祐</h3>
                <p>總設計師</p>
            </div>
        </div>
        <p style="margin-top: 3rem; text-align: center;">更多夥伴招募中...</p>
    </section>

    <script>
        const themeToggle = document.getElementById('theme-toggle');
        const body = document.body;
        const icon = themeToggle.querySelector('i');

        const savedTheme = localStorage.getItem('theme') || 'light-mode';
        body.className = savedTheme;
        updateIcon(savedTheme);

        themeToggle.addEventListener('click', () => {
            const isDark = body.classList.contains('dark-mode');
            const newTheme = isDark ? 'light-mode' : 'dark-mode';
            body.className = newTheme;
            localStorage.setItem('theme', newTheme);
            updateIcon(newTheme);
        });

        function updateIcon(theme) {
            if (theme === 'dark-mode') {
                icon.className = 'fas fa-sun';
            } else {
                icon.className = 'fas fa-moon';
            }
        }
    </script>
</body>
</html>
